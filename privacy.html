<body>
<div class="wrap">
  <a class="back" href="index.html" data-ru="← На главную" data-uz="← Bosh sahifaga" data-en="← Back to home" data-zh="← 返回首页"></a>

  </div>
  <h1 data-ru="Политика конфиденциальности" data-uz="Maxfiylik siyosati" data-en="Privacy Policy" data-zh="隐私政策"></h1>
  <p class="updated" data-ru="Действует с 29 июля 2026 года" data-uz="29-iyul, 2026-yildan amalda" data-en="In effect from 29 July 2026" data-zh="自2026年7月29日起生效"></p>

  <h2 data-ru="1. Общие положения" data-uz="1. Umumiy qoidalar" data-en="1. General provisions" data-zh="1. 总则"></h2>
  <p data-ru="Настоящая политика описывает, как BOSCO Beauty Club (Ташкент, ул. Эльбека, 15) обрабатывает персональные данные посетителей сайта и клиентов, обратившихся через систему онлайн-записи, Telegram или по телефону." data-uz="Ushbu siyosat BOSCO Beauty Club (Toshkent, Elbek ko‘chasi, 15) sayt tashrifchilari va onlayn yozilish tizimi, Telegram yoki telefon orqali murojaat qilgan mijozlarning shaxsiy ma'lumotlarini qanday qayta ishlashini tavsiflaydi." data-en="This policy explains how BOSCO Beauty Club (15 Elbek Street, Tashkent) handles the personal data of website visitors and of clients who contact us through the online booking system, Telegram or by phone." data-zh="本政策说明 BOSCO Beauty Club（塔什干埃尔别克街15号）如何处理网站访客，以及通过在线预约系统、Telegram 或电话与我们联系的顾客的个人信息。"></p>
  <h2 data-ru="2. Какие данные мы собираем" data-uz="2. Qanday ma'lumotlarni to‘playmiz" data-en="2. What data we collect" data-zh="2. 我们收集哪些信息"></h2>
  <ul>
    <li data-ru="Имя и номер телефона — при записи на услугу" data-uz="Ism va telefon raqami — xizmatga yozilishda" data-en="Your name and phone number when you book a service" data-zh="预约服务时提供的姓名和电话号码"></li>
    <li data-ru="Переписка в Telegram — для согласования визита" data-uz="Telegram yozishmalari — tashrifni kelishish uchun" data-en="Telegram correspondence used to arrange your visit" data-zh="用于安排到店时间的 Telegram 聊天记录"></li>
    <li data-ru="Технические данные браузера и обезличенная статистика посещений — для корректной работы сайта и его улучшения" data-uz="Brauzerning texnik ma'lumotlari va anonim tashrif statistikasi — sayt to‘g‘ri ishlashi va yaxshilanishi uchun" data-en="Technical browser data and anonymised visit statistics, used to keep the site working properly and to improve it" data-zh="浏览器技术信息及匿名访问统计，用于保障网站正常运行并加以改进"></li>
  </ul>
  <h2 data-ru="3. Как мы используем данные" data-uz="3. Ma'lumotlardan qanday foydalanamiz" data-en="3. How we use your data" data-zh="3. 我们如何使用这些信息"></h2>
  <p data-ru="Данные используются только для записи на услуги, связи с клиентом и информирования об акциях. Мы не продаём данные и не передаём их третьим лицам, кроме случаев, предусмотренных законодательством Республики Узбекистан." data-uz="Ma'lumotlar faqat xizmatga yozilish, mijoz bilan bog‘lanish va aksiyalar haqida xabar berish uchun ishlatiladi. Biz ma'lumotlarni sotmaymiz va O‘zbekiston Respublikasi qonunchiligida nazarda tutilgan holatlardan tashqari uchinchi shaxslarga bermaymiz." data-en="Your data is used only to book appointments, to contact you, and to tell you about offers. We do not sell your data and do not share it with third parties, except where the law of the Republic of Uzbekistan requires it." data-zh="您的信息仅用于预约服务、与您联系以及告知优惠活动。我们不会出售您的信息，也不会将其提供给第三方，法律另有规定的除外。"></p>
  <h2 data-ru="4. Сторонние сервисы" data-uz="4. Uchinchi tomon xizmatlari" data-en="4. Third-party services" data-zh="4. 第三方服务"></h2>
  <p data-ru="Сайт использует систему онлайн-записи DIKIDI, виджеты 2ГИС и Яндекса, а также сервисы веб-аналитики. Эти сервисы обрабатывают данные в соответствии со своими собственными политиками конфиденциальности." data-uz="Sayt DIKIDI onlayn yozilish tizimi, 2GIS va Yandex vidjetlari hamda veb-analitika xizmatlaridan foydalanadi. Ushbu xizmatlar ma'lumotlarni o‘zlarining maxfiylik siyosatlariga muvofiq qayta ishlaydi." data-en="The site uses the DIKIDI online booking system, 2GIS and Yandex widgets, and web analytics services. These services process data under their own privacy policies." data-zh="本网站使用 DIKIDI 在线预约系统、2GIS 和 Yandex 小工具以及网络分析服务。这些服务依据各自的隐私政策处理数据。"></p>
  <h2 data-ru="5. Хранение и защита" data-uz="5. Saqlash va himoya" data-en="5. Storage and protection" data-zh="5. 存储与保护"></h2>
  <p data-ru="Данные хранятся в системе онлайн-записи и мессенджерах. Мы принимаем разумные организационные и технические меры для защиты информации от несанкционированного доступа." data-uz="Ma'lumotlar onlayn yozilish tizimi va messenjerlarda saqlanadi. Biz ma'lumotlarni ruxsatsiz kirishdan himoya qilish uchun oqilona tashkiliy va texnik choralar ko‘ramiz." data-en="Data is stored in the booking system and in messaging apps. We take reasonable organisational and technical measures to protect it from unauthorised access." data-zh="数据存储于预约系统及即时通讯软件中。我们采取合理的管理与技术措施，防止信息被未经授权访问。"></p>
  <h2 data-ru="6. Ваши права" data-uz="6. Sizning huquqlaringiz" data-en="6. Your rights" data-zh="6. 您的权利"></h2>
  <p data-ru="Вы можете запросить сведения о своих данных, их исправление или удаление, а также отказаться от рассылок — напишите администратору в Telegram: @boscobeauty." data-uz="Siz o‘z ma'lumotlaringiz haqida ma'lumot olish, ularni tuzatish yoki o‘chirishni so‘rashingiz, shuningdek xabarnomalardan voz kechishingiz mumkin — Telegram orqali administratorga yozing: @boscobeauty." data-en="You may ask what data we hold, request corrections or deletion, and opt out of marketing messages — just message the front desk on Telegram: @boscobeauty." data-zh="您可以查询我们所持有的信息、要求更正或删除，也可以退订推广消息——请通过 Telegram 联系前台：@boscobeauty。"></p>
  <h2 data-ru="7. Контакты" data-uz="7. Aloqa" data-en="7. Contact" data-zh="7. 联系方式"></h2>
  <p data-ru="По вопросам, связанным с обработкой данных: bubblebeauty@yandex.com или Telegram @boscobeauty." data-uz="Ma'lumotlarni qayta ishlash bo‘yicha savollar uchun: bubblebeauty@yandex.com yoki Telegram @boscobeauty." data-en="For any question about data handling: bubblebeauty@yandex.com or Telegram @boscobeauty." data-zh="如对数据处理有任何疑问：bubblebeauty@yandex.com 或 Telegram @boscobeauty。"></p>
</div>
<script>
  const langBtns = document.querySelectorAll('.lang-btn');
  const translatable = document.querySelectorAll('[data-ru]');
  function setLang(lang){
    translatable.forEach(el => {
      const val = el.getAttribute('data-' + lang) || el.getAttribute('data-ru');
      if (val !== null) el.innerHTML = val;
    });
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;
    langBtns.forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  }
  langBtns.forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
  setLang('ru');
</script>
</body>
