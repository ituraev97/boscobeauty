<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Политика конфиденциальности — Bosco Beauty Club</title>
<meta name="description" content="Политика конфиденциальности Bosco Beauty Club — как салон обрабатывает данные клиентов, записавшихся через сайт, Telegram или WhatsApp.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://boscobeauty.uz/privacy.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--cream:#f8f3ea; --ink:#1d1815; --wine:#6c2b35;}
  *{box-sizing:border-box;}
  body{background:var(--cream); color:var(--ink); font-family:'Jost',sans-serif; font-size:16px; line-height:1.7; margin:0;}
  .wrap{max-width:760px; margin:0 auto; padding:80px 24px 100px;}
  a.back{font-size:13px; color:var(--wine); font-weight:600;}
  h1{font-family:'Bodoni Moda',serif; font-weight:500; font-size:clamp(28px,4vw,40px); margin:24px 0 8px;}
  .lang-toggle{display:inline-flex; border:1px solid rgba(29,24,21,.25); border-radius:20px; overflow:hidden; font-size:11.5px; font-weight:700; margin-top:20px;}
  .lang-toggle button{background:none; border:none; color:var(--ink); padding:6px 14px; cursor:pointer; font-family:'Jost',sans-serif; font-weight:700; opacity:.55;}
  .lang-toggle button.active{background:var(--wine); opacity:1; color:#fff;}
  h2{font-family:'Bodoni Moda',serif; font-weight:500; font-size:20px; margin:34px 0 10px;}
  p, li{color:#4a423b; font-size:15px;}
  ul{padding-left:20px;}
  .updated{font-size:13px; color:#8a8074; margin-top:6px;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html" data-ru="← На главную" data-uz="← Bosh sahifaga"></a>
  <div class="lang-toggle">
    <button id="btnRu" class="active">RU</button>
    <button id="btnUz">UZ</button>
  </div>
  <h1 data-ru="Политика конфиденциальности" data-uz="Maxfiylik siyosati"></h1>
  <p class="updated" data-ru="Действует с 28 июля 2026 года" data-uz="28-iyul, 2026-yildan amalda"></p>

  <h2 data-ru="1. Общие положения" data-uz="1. Umumiy qoidalar"></h2>
  <p data-ru="Настоящая политика описывает, как Bosco Beauty Club (Ташкент, ул. Эльбека, 15) обрабатывает персональные данные посетителей сайта и клиентов, обратившихся через Telegram, WhatsApp или по телефону." data-uz="Ushbu siyosat Bosco Beauty Club (Toshkent, Elbek ko‘chasi, 15) sayt tashrifchilari va Telegram, WhatsApp yoki telefon orqali murojaat qilgan mijozlarning shaxsiy ma'lumotlarini qanday qayta ishlashini tavsiflaydi."></p>

  <h2 data-ru="2. Какие данные мы собираем" data-uz="2. Qanday ma'lumotlarni to‘playmiz"></h2>
  <ul>
    <li data-ru="Имя и номер телефона — при записи на услугу" data-uz="Ism va telefon raqami — xizmatga yozilishda"></li>
    <li data-ru="Переписка в Telegram/WhatsApp — для согласования визита" data-uz="Telegram/WhatsApp yozishmalari — tashrifni kelishish uchun"></li>
    <li data-ru="Технические данные браузера — для корректной работы сайта" data-uz="Brauzerning texnik ma'lumotlari — sayt to‘g‘ri ishlashi uchun"></li>
  </ul>

  <h2 data-ru="3. Как мы используем данные" data-uz="3. Ma'lumotlardan qanday foydalanamiz"></h2>
  <p data-ru="Данные используются только для записи на услуги, связи с клиентом и информирования об акциях. Мы не передаём данные третьим лицам, кроме случаев, предусмотренных законодательством Республики Узбекистан." data-uz="Ma'lumotlar faqat xizmatga yozilish, mijoz bilan bog‘lanish va aksiyalar haqida xabar berish uchun ishlatiladi. Ma'lumotlar O‘zbekiston Respublikasi qonunchiligida nazarda tutilgan holatlardan tashqari uchinchi shaxslarga berilmaydi."></p>

  <h2 data-ru="4. Хранение и защита" data-uz="4. Saqlash va himoya"></h2>
  <p data-ru="Данные хранятся в мессенджерах (Telegram, WhatsApp) и системе онлайн-записи. Мы принимаем разумные меры для защиты информации от несанкционированного доступа." data-uz="Ma'lumotlar messenjerlarda (Telegram, WhatsApp) va onlayn yozilish tizimida saqlanadi. Biz ma'lumotlarni ruxsatsiz kirishdan himoya qilish uchun oqilona choralar ko‘ramiz."></p>

  <h2 data-ru="5. Ваши права" data-uz="5. Sizning huquqlaringiz"></h2>
  <p data-ru="Вы можете запросить удаление своих данных или отказаться от рассылок, написав администратору в Telegram: @boscobeauty." data-uz="Siz o‘z ma'lumotlaringizni o‘chirishni so‘rashingiz yoki xabarnomalardan voz kechishingiz mumkin — buning uchun Telegram orqali administratorga yozing: @boscobeauty."></p>

  <h2 data-ru="6. Контакты" data-uz="6. Aloqa"></h2>
  <p data-ru="По вопросам, связанным с обработкой данных, пишите на bubblebeauty@yandex.com или в Telegram @boscobeauty." data-uz="Ma'lumotlarni qayta ishlash bo‘yicha savollar uchun bubblebeauty@yandex.com manziliga yoki Telegramda @boscobeauty ga yozing."></p>
</div>
<script>
  const btnRu = document.getElementById('btnRu');
  const btnUz = document.getElementById('btnUz');
  const translatable = document.querySelectorAll('[data-ru]');
  function setLang(lang){
    translatable.forEach(el => {
      const val = lang === 'uz' ? el.getAttribute('data-uz') : el.getAttribute('data-ru');
      if (val !== null) el.innerHTML = val;
    });
    document.documentElement.lang = lang;
    btnRu.classList.toggle('active', lang === 'ru');
    btnUz.classList.toggle('active', lang === 'uz');
  }
  btnRu.addEventListener('click', () => setLang('ru'));
  btnUz.addEventListener('click', () => setLang('uz'));
  setLang('ru');
</script>
</body>
</html>
