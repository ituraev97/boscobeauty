<!DOCTYPE html>
<!--
  Шаблон статьи блога. Используется скриптом tools/new-article.mjs, вручную не копируется.
  Сам файл в выдачу не попадает: robots=noindex и Disallow в robots.txt.

  Порядок добавления языковой версии — см. CLAUDE.md. Коротко:
    1. дописать languages.<lang> в blog/posts.json
    2. написать тело статьи в отдельный файл: от <header class="blog-hero"> до </article>
    3. node tools/new-article.mjs <lang> <slug> <файл-с-телом>
    4. node tools/build-blog.mjs

  Плейсхолдеры подставляет скаффолдер, руками их трогать не нужно.
-->
