  <h2 data-ru="1. Предмет оферты" data-uz="1. Oferta predmeti" data-en="1. Subject of the offer" data-zh="1. 要约内容"></h2>
  <p data-ru="BOSCO Beauty Club (Ташкент, ул. Эльбека, 15) оказывает услуги маникюра, педикюра, ухода за бровями и ресницами, парикмахерские услуги и подологию на условиях, изложенных ниже. Запись на услугу через сайт, систему онлайн-записи, Telegram или по телефону означает согласие с этими условиями." data-uz="BOSCO Beauty Club (Toshkent, Elbek ko‘chasi, 15) quyida keltirilgan shartlar asosida manikyur, pedikyur, qosh va kiprik parvarishi, soch xizmatlari hamda podologiya xizmatlarini ko‘rsatadi. Sayt, onlayn yozilish tizimi, Telegram yoki telefon orqali xizmatga yozilish ushbu shartlarga rozilik bildirishni anglatadi." data-en="BOSCO Beauty Club (15 Elbek Street, Tashkent) provides manicure, pedicure, brow and lash, hair and podiatry services on the terms set out below. Booking through the website, the online booking system, Telegram or by phone means you accept these terms." data-zh="BOSCO Beauty Club（塔什干埃尔别克街15号）依照以下条款提供美甲、美足、眉睫护理、美发及足部护理服务。通过网站、在线预约系统、Telegram 或电话预约即表示您接受这些条款。"></p>
  <h2 data-ru="2. Запись и оплата" data-uz="2. Yozilish va to‘lov" data-en="2. Booking and payment" data-zh="2. 预约与付款"></h2>
  <ul>
    <li data-ru="Запись производится на конкретное время к выбранному мастеру" data-uz="Yozilish tanlangan usta uchun aniq vaqtga amalga oshiriladi" data-en="Appointments are made for a specific time with a specific specialist" data-zh="预约将安排至特定时间及指定技师"></li>
    <li data-ru="Цены указаны в сумах; итоговая стоимость зависит от длины волос, объёма работы и используемых материалов" data-uz="Narxlar so‘mda ko‘rsatilgan; yakuniy narx soch uzunligi, ish hajmi va ishlatiladigan materiallarga bog‘liq" data-en="Prices are shown in Uzbek soum; the final amount depends on hair length, the scope of work and the products used" data-zh="价格以乌兹别克苏姆标示；最终金额取决于发长、工作量及所用产品"></li>
    <li data-ru="Оплата производится наличными или картой в салоне после оказания услуги" data-uz="To‘lov salonda xizmat ko‘rsatilgandan so‘ng naqd yoki karta orqali amalga oshiriladi" data-en="Payment is made at the salon after the service, in cash or by card" data-zh="服务结束后在店内以现金或刷卡方式付款"></li>
  </ul>
  <h2 data-ru="3. Перенос и отмена записи" data-uz="3. Yozuvni ko‘chirish va bekor qilish" data-en="3. Rescheduling and cancellation" data-zh="3. 改约与取消"></h2>
  <p data-ru="Просим предупреждать об отмене или переносе визита заранее — это позволяет освободить время для других гостей. Условия отмены уточняйте у администратора при записи." data-uz="Tashrifni bekor qilish yoki ko‘chirish haqida oldindan xabar berishingizni so‘raymiz — bu boshqa mehmonlar uchun vaqtni bo‘shatishga yordam beradi. Bekor qilish shartlarini yozilishda administratordan aniqlashtiring." data-en="Please let us know in advance if you need to cancel or reschedule, so the slot can be offered to another guest. Ask the front desk about cancellation terms when you book." data-zh="如需取消或改约，请提前告知，以便将时段留给其他顾客。预约时可向前台咨询具体的取消规定。"></p>
  <h2 data-ru="4. Качество и ответственность" data-uz="4. Sifat va javobgarlik" data-en="4. Quality and liability" data-zh="4. 服务质量与责任"></h2>
  <p data-ru="Салон оказывает услуги силами квалифицированных мастеров с использованием стерильных инструментов. О противопоказаниях (аллергия, чувствительность кожи, заболевания ногтей и кожи, беременность) просим сообщать мастеру до начала процедуры. Если результат вас не устроил, сообщите об этом в салоне — мы постараемся исправить ситуацию." data-uz="Salon xizmatlarni malakali ustalar tomonidan steril asboblar yordamida ko‘rsatadi. Qarshi ko‘rsatmalar (allergiya, teri sezuvchanligi, tirnoq va teri kasalliklari, homiladorlik) haqida protsedura boshlanishidan oldin ustaga xabar berishingizni so‘raymiz. Natijadan norozi bo‘lsangiz, salonga bildiring — vaziyatni tuzatishga harakat qilamiz." data-en="Services are carried out by qualified specialists using sterilised tools. Please tell your specialist before the treatment about any contraindications — allergies, sensitive skin, nail or skin conditions, or pregnancy. If you are not happy with the result, tell us at the salon and we will do our best to put it right." data-zh="服务由具备资质的技师使用经消毒的器械完成。如有过敏、皮肤敏感、甲部或皮肤疾病、怀孕等禁忌情况，请在服务开始前告知技师。若您对效果不满意，请在店内告知我们，我们会尽力予以补救。"></p>

<script>
  const langBtns = document.querySelectorAll('.lang-btn');
  const translatable = document.querySelectorAll('[data-ru]');
  function setLang(lang){
    translatable.forEach(el => {
      const val = el.getAttribute('data-' + lang) || el.getAttribute('data-ru');
      if (val !== null) el.innerHTML = val;
    });
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;
    langBtns.forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
  }
  langBtns.forEach(b => b.addEventListener('click', () => setLang(b.dataset.lang)));
  setLang('ru');
</script>
