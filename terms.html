<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Публичная оферта — Bosco Beauty Club</title>
<meta name="description" content="Публичная оферта Bosco Beauty Club — условия записи, оплаты и оказания услуг салона красоты в Ташкенте.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://boscobeauty.uz/terms.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;1,6..96,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--cream:#f8f3ea; --ink:#1d1815; --wine:#6c2b35;}
  *{box-sizing:border-box;}
  body{background:var(--cream); color:var(--ink); font-family:'Jost',sans-serif; font-size:16px; line-height:1.7; margin:0;}
  .wrap{max-width:760px; margin:0 auto; padding:80px 24px 100px;}
  a.back{font-size:13px; color:var(--wine); font-weight:600;}
  h1{font-family:'Bodoni Moda',serif; font-weight:500; font-size:clamp(28px,4vw,40px); margin:24px 0 8px;}
  .lang-toggle{display:inline-flex; border:1px solid rgba(29,24,21,.25); border-radius:20px; overflow:hidden; font-size:11.5px; font-weight:700; margin-top:20px;}
  .lang-toggle button{background:none; border:none; color:var(--ink); padding:6px 14px; cursor:pointer; font-family:'Jost',sans-serif; font-weight:700; opacity:.55;}
  .lang-toggle button.active{background:var(--wine); opacity:1; color:#fff;}
  h2{font-family:'Bodoni Moda',serif; font-weight:500; font-size:20px; margin:34px 0 10px;}
  p, li{color:#4a423b; font-size:15px;}
  ul{padding-left:20px;}
  .updated{font-size:13px; color:#8a8074; margin-top:6px;}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html" data-ru="← На главную" data-uz="← Bosh sahifaga"></a>
  <div class="lang-toggle">
    <button id="btnRu" class="active">RU</button>
    <button id="btnUz">UZ</button>
  </div>
  <h1 data-ru="Публичная оферта" data-uz="Ommaviy oferta"></h1>
  <p class="updated" data-ru="Действует с 28 июля 2026 года" data-uz="28-iyul, 2026-yildan amalda"></p>

  <h2 data-ru="1. Предмет оферты" data-uz="1. Oferta predmeti"></h2>
  <p data-ru="Bosco Beauty Club (Ташкент, ул. Эльбека, 15) предлагает услуги маникюра, педикюра, ухода за бровями и ресницами, а также парикмахерские услуги на условиях, изложенных ниже. Запись на услугу через Telegram, WhatsApp, телефон или сайт означает согласие с условиями." data-uz="Bosco Beauty Club (Toshkent, Elbek ko‘chasi, 15) quyida keltirilgan shartlar asosida manikyur, pedikyur, qosh va kiprik parvarishi hamda soch xizmatlarini taklif etadi. Telegram, WhatsApp, telefon yoki sayt orqali xizmatga yozilish ushbu shartlarga rozilik bildirishni anglatadi."></p>

  <h2 data-ru="2. Запись и оплата" data-uz="2. Yozilish va to‘lov"></h2>
  <ul>
    <li data-ru="Запись производится на конкретное время у выбранного мастера" data-uz="Yozilish tanlangan usta uchun aniq vaqtga amalga oshiriladi"></li>
    <li data-ru="Цены на услуги указаны в сумах и могут уточняться администратором" data-uz="Xizmatlar narxi so‘mda ko‘rsatilgan va administrator tomonidan aniqlashtirilishi mumkin"></li>
    <li data-ru="Оплата производится наличными или картой в салоне после оказания услуги" data-uz="To‘lov salonda xizmat ko‘rsatilgandan so‘ng naqd yoki karta orqali amalga oshiriladi"></li>
  </ul>

  <h2 data-ru="3. Перенос и отмена записи" data-uz="3. Yozuvni ko‘chirish va bekor qilish"></h2>
  <p data-ru="Просим предупреждать об отмене или переносе визита заранее — это позволяет освободить время для других гостей. Условия отмены уточняйте у администратора при записи." data-uz="Tashrifni bekor qilish yoki ko‘chirish haqida oldindan xabar berishingizni so‘raymiz — bu boshqa mehmonlar uchun vaqtni bo‘shatishga yordam beradi. Bekor qilish shartlarini yozilishda administratordan aniqlashtiring."></p>

  <h2 data-ru="4. Ответственность" data-uz="4. Javobgarlik"></h2>
  <p data-ru="Салон обязуется оказывать услуги квалифицированными мастерами с использованием стерильных инструментов. Об индивидуальных противопоказаниях (аллергия, чувствительность и т.д.) просим сообщать мастеру до начала процедуры." data-uz="Salon xizmatlarni malakali ustalar tomonidan steril asboblar yordamida ko‘rsatishni o‘z zimmasiga oladi. Individual qarshi ko‘rsatmalar (allergiya, sezuvchanlik va h.k.) haqida protsedura boshlanishidan oldin ustaga xabar berishingizni so‘raymiz."></p>

  <h2 data-ru="5. Контакты" data-uz="5. Aloqa"></h2>
  <p data-ru="Telegram: @boscobeauty · Телефон: +998 95 120 70 20 · Адрес: Ташкент, ул. Эльбека, 15." data-uz="Telegram: @boscobeauty · Telefon: +998 95 120 70 20 · Manzil: Toshkent, Elbek ko‘chasi, 15."></p>
</div>
<script>
  const btnRu = document.getElementById('btnRu');
  const btnUz = document.getElementById('btnUz');
  const translatable = document.querySelectorAll('[data-ru]');
  function setLang(lang){
    translatable.forEach(el => {
      const val = lang === 'uz' ? el.getAttribute('data-uz') : el.getAttribute('data-ru');
      if (val !== null) el.innerHTML = val;
    });
    document.documentElement.lang = lang;
    btnRu.classList.toggle('active', lang === 'ru');
    btnUz.classList.toggle('active', lang === 'uz');
  }
  btnRu.addEventListener('click', () => setLang('ru'));
  btnUz.addEventListener('click', () => setLang('uz'));
  setLang('ru');
</script>
</body>
</html>
